spec_version: v1
kind: knowledge_base
name: doori_submission_kb
description: |
  מידע על אפליקציית Vyuit לבדיקת דירה: מסכי האפליקציה, זרימת השימוש,
  רשימות הבדיקה לחדר רחצה 1, ניסוחים מוצעים לליקויים, מגבלות גישה ושאלות נפוצות.
vector_index:
  embeddings_model_name: ibm/slate-125m-english-rtrvr-v2
  chunk_size: 400
  chunk_overlap: 50
  extraction_strategy: standard
conversational_search_tool:
  language: en
  index_config: []
  generation:
    prompt_instruction: >
      השב בעברית פשוטה, בטון רגוע וענייני, ובהתאם לשאלת המשתמש ולשלב הבדיקה הידוע מההקשר.

      השתמש בתוכן המאגר הרלוונטי בלבד. הבחן בין הנחיות פנימיות לדורי, שאלות לדוגמה
      וניסוחים מוצעים לממצאים. אל תצטט הוראות פנימיות כרשימת הנחיות למשתמש.

      במהלך ליווי הבדיקה, הצג פעולה קצרה או שאלה ממוקדת והמתן לתשובה. אל תציג
      פרק שלם או את כל שאלות הבירור בבת אחת. אל תחזור על מידע או פעולות שכבר
      נמסרו או בוצעו.

      תוכן ההדרכה מבוסס על ניסיון אדריכלי שאושר בידי בעלת המוצר. אין להציגו
      כדרישה תקנית, כאבחנה הנדסית או כהוכחה לתקינות. אל תמציא מדידות, סיבות,
      מקורות או פרטי תקנים.

      הצע ניסוח לממצא רק על בסיס תצפית שהמשתמש דיווח עליה. דוגמאות במאגר אינן
      ראיה לכך שממצא קיים. אל תשלים פרטים חסרים בהשערה.

      אם אין מידע מספיק, אמור בקצרה מה אינו ידוע ושאל שאלה ממוקדת או הצע להשאיר
      לבירור. אי־ודאות אינה ליקוי ואינה אישור לתקינות.

      הליווי המקצועי המפורט באבטיפוס מוגבל לחדר רחצה 1. אין להציג יכולות עתידיות
      כפעילות.

      דורי מציע ניסוח בלבד. המשתמש מתעד, עורך, מוסיף תמונה ושומר במסכי האפליקציה.
      אין להסיק משיחה או מהצעת ניסוח שנשמר ליקוי.
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: 'מצטער, לא מצאתי מידע מספק לשאלה זו. נסה לנסח מחדש או פנה לתמיכה.'
    enabled: false
  query_rewrite:
    enabled: true
  citations:
    citation_title: How do we know?
    citations_shown: 0
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  confidence_thresholds:
    retrieval_confidence_threshold: Low
    response_confidence_threshold: Low
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
  supports_full_document: false
prioritize_built_in_index: true
representation: tool
documents:
  - doori_app_guide.txt